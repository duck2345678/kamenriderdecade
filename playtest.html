                    { r: [1583, 44, 1709, 221], d: 0.08 }
                ]
            },
            ATTACK_K: {
                tex: 'attackK', loop: false,
                frames: [
                    { r: [30, 77, 287, 363], d: 0.08 },
                    { r: [321, 62, 619, 363], d: 0.08 },
                    { r: [645, 66, 994, 363], d: 0.08 },
                    { r: [1031, 74, 1355, 363], d: 0.08 },
                    { r: [1438, 27, 1710, 363], d: 0.08 }
                ]
            },
            ATTACK_L: {
                tex: 'attackL', loop: false,
                frames: [
                    { r: [28, 44, 183, 335], d: 0.08 },
                    { r: [266, 52, 496, 335], d: 0.08 },
                    { r: [566, 50, 794, 335], d: 0.12 },
                    { r: [867, 28, 1043, 335], d: 0.08 },
                    { r: [1136, 28, 1300, 335], d: 0.08 }
                ]
            },
            KICK: {
                tex: 'kick', loop: false,
                frames: [
                    { r: [38, 26, 126, 248], d: 0.08 },
                    { r: [182, 26, 269, 248], d: 0.08 },
                    { r: [324, 26, 411, 248], d: 0.08 },
                    { r: [462, 23, 554, 248], d: 0.08 },
                    { r: [598, 25, 684, 248], d: 0.08 },
                    { r: [738, 30, 877, 248], d: 0.08 },
                    { r: [932, 33, 1052, 248], d: 0.08 },
                    { r: [1105, 39, 1267, 248], d: 0.12 },
                    { r: [1315, 30, 1499, 248], d: 0.14 },
                    { r: [1526, 45, 1694, 248], d: 0.14 }
                ]
            }
        };

        const keys = {};
        window.addEventListener('keydown', e => {
            keys[e.key.toLowerCase()] = true;
            if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(e.key.toLowerCase())) {
                e.preventDefault();
            }
        });
        window.addEventListener('keyup', e => {
            keys[e.key.toLowerCase()] = false;
        });

        function setState(newState) {
            if (player.state === newState) return;
            player.state = newState;
            player.frameIndex = 0;
            player.timer = 0;

            if (newState === 'KICK') {
                player.cards = [];
                const dir = player.flipX ? -1 : 1;
                for (let i = 1; i <= 4; i++) {
                    player.cards.push({
                        x: player.x + dir * (i * 60),
                        y: player.y + (i * 15) - 30,
                        shattered: false
                    });
                }
            } else if (newState === 'ATTACK_L') {
                setTimeout(() => {
                    const dir = player.flipX ? -1 : 1;
                    player.bullets.push({
                        x: player.x + (dir * 25),
                        y: player.y - 12,
                        vx: dir * 450,
                        life: 1.5
                    });
                }, 100);
            }
        }

        function isSolid(wx, wy) {
            if (wx < 0 || wx >= MAP_PIXEL_W || wy < 0 || wy >= MAP_PIXEL_H) return false;
            const c = Math.floor(wx / TILE_SIZE);
            const r = Math.floor(wy / TILE_SIZE);
            return collisionData[r * MAP_W + c] > 0;
        }

        function checkGroundCollision(p) {
            const feetY = p.y + p.h / 2;
            const leftX = p.x - p.w * 0.35;
            const rightX = p.x + p.w * 0.35;
            const midX = p.x;

            for (let checkY = feetY; checkY <= feetY + 6; checkY += 2) {
                if (isSolid(leftX, checkY) || isSolid(midX, checkY) || isSolid(rightX, checkY)) {
                    const r = Math.floor(checkY / TILE_SIZE);
                    p.y = (r * TILE_SIZE) - (p.h / 2);
                    return true;
                }
            }
            return false;
        }

        function isAttacking() {
            return ['ATTACK_J', 'ATTACK_K', 'ATTACK_L', 'KICK'].includes(player.state);
        }

        function updatePlayer(dt) {
            // Attacks have priority
            if (!isAttacking()) {
                if (keys['o']) {
                    setState('KICK');
                    player.vx = player.flipX ? -260 : 260;
                    player.vy = -180;
                } else if (keys['j']) {
                    setState('ATTACK_J');
                    player.vx = 0;
                } else if (keys['k']) {
                    setState('ATTACK_K');
                    player.vx = 0;
                } else if (keys['l']) {
                    setState('ATTACK_L');
                    player.vx = 0;
                } else if (keys['arrowdown'] || keys['s']) {
                    if (player.isGrounded) {
                        setState('BLOCK');
                        player.vx = 0;
                    }
                } else if ((keys[' '] || keys['arrowup'] || keys['w']) && player.isGrounded) {
                    player.vy = -380;
                    player.isGrounded = false;
                    setState('JUMP');
                } else if (keys['arrowleft'] || keys['a']) {
                    player.flipX = true;
                    player.vx = -140;
                    if (player.isGrounded) setState('WALK');
                } else if (keys['arrowright'] || keys['d']) {
                    player.flipX = false;
                    player.vx = 140;
                    if (player.isGrounded) setState('WALK');
                } else {
                    player.vx = 0;
                    if (player.isGrounded) setState('IDLE');
                }
            }

            // Gravity
            if (!player.isGrounded) {
                player.vy += 980 * dt;
                if (player.vy > 600) player.vy = 600;
                if (!isAttacking()) setState('JUMP');
            }

            // Move X
            const newX = player.x + player.vx * dt;
            const sideCheckX = (player.vx > 0) ? (newX + player.w * 0.4) : (newX - player.w * 0.4);
            if (isSolid(sideCheckX, player.y) || isSolid(sideCheckX, player.y - player.h * 0.3) || isSolid(sideCheckX, player.y + player.h * 0.3)) {
                player.vx = 0;
            } else {
                player.x = newX;
            }

            // Move Y
            player.y += player.vy * dt;

            // Ground collision
            if (player.vy >= 0 && checkGroundCollision(player)) {
                player.vy = 0;
                player.isGrounded = true;
            } else {
                player.isGrounded = false;
            }

            // Animate
            const anim = animations[player.state] || animations.IDLE;
            player.timer += dt;
            if (player.timer >= anim.frames[player.frameIndex].d) {
                player.timer -= anim.frames[player.frameIndex].d;
                player.frameIndex++;
                if (player.frameIndex >= anim.frames.length) {
                    if (anim.loop) {
                        player.frameIndex = 0;
                    } else {
                        player.frameIndex = anim.frames.length - 1;
                        if (isAttacking()) {
                            setState(player.isGrounded ? 'IDLE' : 'JUMP');
                        }
                    }
                }
            }

            // Bullets
            for (let i = player.bullets.length - 1; i >= 0; i--) {
                const b = player.bullets[i];
                b.x += b.vx * dt;
                b.life -= dt;
                if (b.life <= 0 || isSolid(b.x, b.y)) {
                    player.bullets.splice(i, 1);
                }
            }

            camera.update(player.x, player.y);
        }

        function drawParallax(img, scrollSpeed, screenY, scale = 2.5) {
            const scaledW = 256 * scale;
            let startX = -((camera.x * scrollSpeed) % scaledW);
            if (startX > 0) startX -= scaledW;

            while (startX < 640) {
                ctx.drawImage(img, startX, screenY, scaledW, 192 * scale);
                startX += scaledW;
            }
        }

        function render() {
            ctx.clearRect(0, 0, 640, 448);

            // 1. Parallax
            drawParallax(textures.bgFar, 0.1, 0);
            drawParallax(textures.bgMid, 0.3, 50);
            drawParallax(textures.bgNear, 0.5, 100);

            // 2. TileMap
            const startCol = Math.max(0, Math.floor(camera.x / TILE_SIZE));
            const endCol = Math.min(MAP_W - 1, Math.floor((camera.x + camera.w) / TILE_SIZE) + 1);
            const startRow = Math.max(0, Math.floor(camera.y / TILE_SIZE));
            const endRow = Math.min(MAP_H - 1, Math.floor((camera.y + camera.h) / TILE_SIZE) + 1);

            for (let r = startRow; r <= endRow; r++) {
                for (let c = startCol; c <= endCol; c++) {
                    const tileId = visualData[r * MAP_W + c];
                    if (tileId <= 0) continue;

                    const idx = tileId - 1;
                    const srcCol = idx % 24;
                    const srcRow = Math.floor(idx / 24);

                    const sx = srcCol * TILE_SIZE;
                    const sy = srcRow * TILE_SIZE;
                    const dx = c * TILE_SIZE - camera.x;
                    const dy = r * TILE_SIZE - camera.y;

                    ctx.drawImage(textures.tileset, sx, sy, TILE_SIZE, TILE_SIZE, dx, dy, TILE_SIZE, TILE_SIZE);
                }
            }

            // 3. Floating Dimension Cards
            if (player.state === 'KICK') {
                for (const c of player.cards) {
                    const cx = c.x - camera.x;
                    const cy = c.y - camera.y;
                    ctx.save();
                    ctx.globalAlpha = 0.85;
                    ctx.drawImage(textures.card, 59, 10, 91, 190, cx - 20, cy - 40, 40, 80);
                    ctx.restore();
                }
            }

            // 4. Bullets
            for (const b of player.bullets) {
                const bx = b.x - camera.x;
                const by = b.y - camera.y;
                ctx.save();
                if (b.vx < 0) {
                    ctx.translate(bx, by);
                    ctx.scale(-1, 1);
                    ctx.drawImage(textures.bullet, -18, -6, 36, 12);
                } else {
                    ctx.drawImage(textures.bullet, bx - 18, by - 6, 36, 12);
                }
                ctx.restore();
            }

            // 5. Decade Player
            const anim = animations[player.state] || animations.IDLE;
            const fr = anim.frames[player.frameIndex];
            const [rx, ry, rx2, ry2] = fr.r;
            const fw = rx2 - rx;
            const fh = ry2 - ry;
            const scale = 0.38;
            const dw = fw * scale;
            const dh = fh * scale;

            const px = player.x - camera.x;
            const py = player.y - camera.y;

            ctx.save();
            ctx.translate(px, py);
            if (player.flipX) ctx.scale(-1, 1);
            ctx.drawImage(textures[anim.tex], rx, ry, fw, fh, -dw / 2, -dh / 2, dw, dh);
            ctx.restore();

            // 6. HUD
            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            ctx.fillRect(10, 10, 200, 36);
            ctx.strokeStyle = '#ff007f';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(10, 10, 200, 36);

            ctx.fillStyle = '#ff007f';
            ctx.font = 'bold 12px "Segoe UI", sans-serif';
            ctx.fillText('KAMEN RIDER DECADE', 20, 26);

            // HP bar
            ctx.fillStyle = '#222';
            ctx.fillRect(20, 32, 175, 8);
            ctx.fillStyle = '#00ff88';
            ctx.fillRect(20, 32, 175 * (player.health / 100), 8);

            // Action tag
            ctx.fillStyle = 'rgba(255, 0, 127, 0.2)';
            ctx.fillRect(490, 10, 140, 24);
            ctx.strokeStyle = '#ff007f';
            ctx.strokeRect(490, 10, 140, 24);
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 11px monospace';
            ctx.fillText('STATE: ' + player.state, 500, 26);
        }

        let lastTime = performance.now();
        function gameLoop(now) {
            const dt = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;
            updatePlayer(dt);
            render();
            requestAnimationFrame(gameLoop);
        }

        function initGame() {
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
